name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches requires-python. Running the floor catches syntax or
          # stdlib usage that would break the oldest supported version.
          python-version: "3.9"
      - run: pip install -e .
      - run: python scripts/validate_skills.py
      - run: python -m unittest discover -s tests
