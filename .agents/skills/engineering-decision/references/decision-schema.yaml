version: 1

# 子结构定义：issue 见 issue-schema.yaml；
# project_complexity 见 project-complexity-schema.yaml。

decision_brief:
  # 决策状态。枚举：active | implemented | deferred | superseded | invalidated
  status: active
  # 有效期与重评信号，规则见 SKILL.md“决策有效期与重评估”
  validity:
    # 主域默认：clear P3M / complicated P1M / complex P2W / chaotic P1D / confused P1W
    expires_after: P1M
    last_assessed_at: ""
    reevaluate_on: []
  # 被新 decision brief 取代时记录其标识
  superseded_by: ""
  issue: {}
  context_summary: ""
  project_complexity: {}
  information_layers:
    facts: []
    goals: []
    constraints: []
    assumptions: []
    unknowns: []
    conflicts: []
    risks: []
    decisions: []
  classification:
    # 自由文本，例如：需求探索、技术选型、事故处理、文档对齐
    problem_type: unknown
    # 枚举：clear | complicated | complex | chaotic | confused
    cynefin_domain: confused
    # 枚举：low | medium | high；各级允许的输出见 SKILL.md“置信度限制行为”
    confidence: low
    confidence_limit: ""
    evidence: []
    # 备选域，取值同 cynefin_domain
    alternatives: []
    reclassify_when: []
  behavior:
    # 枚举：direct-execution | expert-analysis | iterative-discovery |
    #       stabilization | clarification | review-and-alignment
    # 定义见 .agents/shared/engagement-and-behavior.md
    mode: clarification
    purpose: ""
    # 枚举：L0 | L1 | L2 | L3 | L4
    # 定义见 .agents/shared/engagement-and-behavior.md
    engagement_level: L3
    allowed_actions: []
    blocked_actions: []
    confirmation_gates: []
  next_action:
    description: ""
    owner: ""
    expected_evidence: ""
  document_contract:
    needed: false
    # 枚举：issue-brief | prd | exploratory-prd | srs | adr | ux-spec |
    #       experiment-plan | incident-brief | high-level-design | detailed-design
    type: ""
    # 枚举：exploratory-draft | draft | proposed-baseline | approved-baseline
    status: exploratory-draft
    purpose: ""
    required_sections: []
    prohibited_sections: []
  next_questions: []
